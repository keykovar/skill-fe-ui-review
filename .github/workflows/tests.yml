name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Python tests
        run: python -B -m unittest discover -s "tests" -p "test_*.py"

      - name: Run Node.js tests
        run: node --test "tests/test_capture_web.mjs"

      - name: Validate example suite
        run: python -B "skills/fe-ui-review/scripts/run_suite.py" --suite "skills/fe-ui-review/assets/example-suite.json" --validate-only
